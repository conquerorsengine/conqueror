name: Release

# 47: Hub > Installs için sürüm yayımlama. "v*" etiketi = GitHub Release (etikette "-" varsa Pre-release), main'e her push =
# ConquerorX kanalı (tek "conquerorx" ön sürümü her commit'te yenilenir; kuruluysa Hub her açılışta ona günceller).
# Her sürüm: işletim sistemi başına editör arşivi + modül arşivleri (hazır derlenmiş oyuncular, dil araç zincirleri, belgeler) +
# conqueror-release.json (boyut, SHA-256). Arşivler Tools/Release/package.py, bildirim make_manifest.py ile yapılır.
on:
  push:
    # ci/release-*: deneme (her şey derlenir ve paketlenir, yayımlanmaz; dosyalar iş akışı çıktısı olarak kalır)
    branches: [main, "ci/release-*"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (false: only build and keep the files as a workflow artifact)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-') && 'prerelease' || 'official') || 'conquerorx' }}

jobs:
  editor-linux:
    name: Editor + Linux player (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libgtk-3-dev libgl-dev python3-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p sharedlib && cp -a build/lib/*.so* sharedlib/
          python3 Tools/Release/package.py editor --bin build/bin --lib build/lib --host linux-x86_64 --out dist --channel $CHANNEL
          python3 Tools/Release/package.py module linux --host any --out dist --add build/bin/ConquerorRuntime=player/linux/bin/ConquerorRuntime --add sharedlib=player/linux/lib
          python3 Tools/Release/package.py module docs --host any --out dist --add Docs=docs
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux, path: dist, retention-days: 3 }

  editor-linux-arm64:
    name: Editor + Linux player (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libgtk-3-dev libgl-dev python3-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p sharedlib && cp -a build/lib/*.so* sharedlib/
          python3 Tools/Release/package.py editor --bin build/bin --lib build/lib --host linux-arm64 --out dist --channel $CHANNEL
          python3 Tools/Release/package.py module linux-arm64 --host any --out dist --add build/bin/ConquerorRuntime=player/linux-arm64/bin/ConquerorRuntime --add sharedlib=player/linux-arm64/lib
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux-arm64, path: dist, retention-days: 3 }

  editor-windows:
    name: Editor + Windows player (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel 2 -- '/clp:ErrorsOnly;Summary' /v:minimal
      - name: Package
        shell: bash
        run: |
          BIN=build/bin; [ -d build/bin/Release ] && BIN=build/bin/Release
          python Tools/Release/package.py editor --bin $BIN --host windows-x86_64 --out dist --channel $CHANNEL
          mkdir -p player/bin && cp $BIN/ConquerorRuntime.exe player/bin/ && cp $BIN/*.dll player/bin/ 2>/dev/null || true
          python Tools/Release/package.py module windows --host any --out dist --add player=player/windows
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows, path: dist, retention-days: 3 }

  editor-macos:
    name: Editor + Mac player (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          brew install ninja || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Package
        run: |
          python3 Tools/Release/package.py editor --bin build/bin --lib build/lib --host macos-arm64 --out dist --channel $CHANNEL
          python3 Tools/Release/package.py module macos --host any --out dist --add build/bin/ConquerorRuntime=player/macos/bin/ConquerorRuntime
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist, retention-days: 3 }

  embedded-linux:
    name: Embedded Linux player (ARM64, Wayland, OpenGL ES)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libxkbcommon-dev libwayland-dev wayland-protocols
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCQ_RUNTIME_ONLY=ON -DCQ_DEFAULT_GL_PROFILE=es3.2 -DCQ_ENABLE_VULKAN=OFF -DCQ_LINUX_ENGINE_CORE_STATIC=ON \
            -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=ON
          cmake --build build --target ConquerorRuntime --parallel
      - name: Package
        run: |
          mkdir -p sharedlib && cp -a build/lib/*.so* sharedlib/ 2>/dev/null || true
          python3 Tools/Release/package.py module embedded-linux --host any --out dist --add build/bin/ConquerorRuntime=player/embedded-linux/bin/ConquerorRuntime --add sharedlib=player/embedded-linux/lib
      - uses: actions/upload-artifact@v4
        with:
          name: dist-embedded-linux
          path: dist
          retention-days: 3

  web:
    name: Web player module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $HOME/emsdk
          $HOME/emsdk/emsdk install 6.0.13 && $HOME/emsdk/emsdk activate 6.0.13
          source $HOME/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DCQ_WEB_THREADS=OFF
          cmake --build build-web --target ConquerorRuntime --parallel
      - name: Package
        run: python3 Tools/Release/package.py module web --host any --out dist --add build-web/bin=player/web
      - uses: actions/upload-artifact@v4
        with: { name: dist-web, path: dist, retention-days: 3 }

  android:
    name: Android player module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static
          cmake --build build-android --target conqueror --parallel
      - name: Package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SO=$(find build-android -name 'libconqueror.so' | head -1)
          # bundletool (Apache-2.0): App Bundle (.aab) paketleme
          python3 Tools/Release/fetch_toolchain.py bundletool any tc/bundletool
          for m in android meta-quest android-xr; do
            python3 Tools/Release/package.py module $m --host any --out dist --add $SO=player/android/arm64-v8a/libconqueror.so --add tc/bundletool=bundletool
          done
      - uses: actions/upload-artifact@v4
        with: { name: dist-android, path: dist, retention-days: 3 }

  linux-extra:
    name: Linux ${{ matrix.arch }} player (module linux-extra)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: armhf, key: linux-arm-32-bit }
          - { arch: i386, key: linux-x86-32-bit }
          - { arch: riscv64, key: linux-risc-v }
          - { arch: ppc64el, key: linux-powerpc }
          - { arch: loong64, key: linux-loongarch }
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
      - name: Build
        run: |
          Tools/Linux/make-linux-sysroot.sh ${{ matrix.arch }} $HOME/sysroot
          cmake -S . -B build-cross -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=Tools/Linux/linux-cross.toolchain.cmake \
            -DCQ_LINUX_ARCH=${{ matrix.arch }} -DCQ_LINUX_SYSROOT=$HOME/sysroot -DCQ_RUNTIME_ONLY=ON -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build-cross --target ConquerorRuntime --parallel
          mkdir -p raw/player/${{ matrix.key }}/bin && cp build-cross/bin/ConquerorRuntime raw/player/${{ matrix.key }}/bin/
          mkdir -p raw/player/${{ matrix.key }}/lib && cp -a build-cross/lib/*.so* raw/player/${{ matrix.key }}/lib/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: raw-linux-extra-${{ matrix.arch }}
          path: raw
          retention-days: 3

  hurd:
    name: GNU/Hurd player (module hurd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
      - name: Build
        run: |
          Tools/Hurd/make-sysroot.sh $HOME/hurd-sysroot
          cmake -S . -B build-hurd -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=Tools/Hurd/hurd-cross.toolchain.cmake \
            -DCQ_HURD_SYSROOT=$HOME/hurd-sysroot -DCQ_RUNTIME_ONLY=ON -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build-hurd --target ConquerorRuntime --parallel
          python3 Tools/Release/package.py module hurd --host any --out dist --add build-hurd/bin/ConquerorRuntime=player/gnu-hurd/bin/ConquerorRuntime
      - uses: actions/upload-artifact@v4
        with: { name: dist-hurd, path: dist, retention-days: 3 }

  freebsd:
    name: FreeBSD player (module bsd)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 12288
          prepare: |
            pkg install -y cmake ninja pkgconf python3 xorgproto libX11 libXrandr libXinerama libXcursor libXi libXext \
              libxkbcommon wayland wayland-protocols evdev-proto
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCQ_RUNTIME_ONLY=ON
            cmake --build build --target ConquerorRuntime
      - name: Collect
        run: |
          mkdir -p raw/player/freebsd/bin && cp build/bin/ConquerorRuntime raw/player/freebsd/bin/
          mkdir -p raw/player/freebsd/lib && cp -a build/lib/*.so* raw/player/freebsd/lib/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: raw-bsd-freebsd, path: raw, retention-days: 3 }

  openbsd:
    name: OpenBSD player (module bsd)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/openbsd-vm@v1
        with:
          mem: 12288
          prepare: |
            pkg_add -I cmake ninja
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCQ_RUNTIME_ONLY=ON
            cmake --build build --target ConquerorRuntime
      - name: Collect
        run: |
          mkdir -p raw/player/openbsd/bin && cp build/bin/ConquerorRuntime raw/player/openbsd/bin/
          mkdir -p raw/player/openbsd/lib && cp -a build/lib/*.so* raw/player/openbsd/lib/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: raw-bsd-openbsd, path: raw, retention-days: 3 }

  netbsd:
    name: NetBSD player (module bsd)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/netbsd-vm@v1
        with:
          mem: 12288
          prepare: |
            /usr/sbin/pkg_add pkgin || true
            pkgin -y install cmake ninja-build
            for set in xbase xcomp; do
              ftp -o - "https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r)/$(uname -m)/binary/sets/$set.tar.xz" | tar -xJpf - -C /
            done
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCQ_RUNTIME_ONLY=ON "-DCMAKE_PREFIX_PATH=/usr/X11R7;/usr/pkg"
            cmake --build build --target ConquerorRuntime
      - name: Collect
        run: |
          mkdir -p raw/player/netbsd/bin && cp build/bin/ConquerorRuntime raw/player/netbsd/bin/
          mkdir -p raw/player/netbsd/lib && cp -a build/lib/*.so* raw/player/netbsd/lib/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: raw-bsd-netbsd, path: raw, retention-days: 3 }

  languages:
    name: Language modules (${{ matrix.host }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        host: [linux-x86_64, linux-arm64, windows-x86_64, macos-arm64]
    steps:
      - uses: actions/checkout@v5
      - name: Fetch bundled toolchains (checksums verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/Release/fetch_toolchain.py zig ${{ matrix.host }} tc/zig
          python3 Tools/Release/fetch_toolchain.py jdk ${{ matrix.host }} tc/jdk
          python3 Tools/Release/fetch_toolchain.py dotnet ${{ matrix.host }} tc/dotnet
          if [ "${{ matrix.host }}" = "windows-x86_64" ]; then python3 Tools/Release/fetch_toolchain.py llvm-mingw ${{ matrix.host }} tc/llvm-mingw; fi
      - name: Package
        run: |
          H=${{ matrix.host }}
          python3 Tools/Release/package.py module zig --host $H --out dist --add tc/zig=zig --add Resources/Scripting/Zig=sdk --bundles zig
          python3 Tools/Release/package.py module java --host $H --out dist --add tc/jdk=jdk --add Resources/Scripting/Java=sdk --bundles jdk
          python3 Tools/Release/package.py module csharp --host $H --out dist --add tc/dotnet=dotnet --add Resources/Scripting/CSharp=sdk --bundles dotnet
          if [ "$H" = "windows-x86_64" ]; then
            python3 Tools/Release/package.py module cpp --host $H --out dist --add tc/llvm-mingw=llvm-mingw --add Resources/Scripting/Cpp=sdk --bundles cpp-compiler
            python3 Tools/Release/package.py module c --host $H --out dist --add tc/llvm-mingw=llvm-mingw --add Resources/Scripting/C=sdk --bundles c-compiler
          else
            python3 Tools/Release/package.py module cpp --host $H --out dist --add Resources/Scripting/Cpp=sdk
            python3 Tools/Release/package.py module c --host $H --out dist --add Resources/Scripting/C=sdk
          fi
          python3 Tools/Release/package.py module rust --host $H --out dist --add Resources/Scripting/Rust=sdk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-languages-${{ matrix.host }}
          path: dist
          retention-days: 3

  publish:
    name: Publish (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ConquerorX' }})
    needs: [editor-linux, editor-linux-arm64, editor-windows, editor-macos, embedded-linux, web, android, languages, linux-extra, hurd, freebsd, openbsd, netbsd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: dist-*, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: raw-linux-extra, pattern: raw-linux-extra-*, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: raw-bsd, pattern: raw-bsd-*, merge-multiple: true }
      - name: Multi-player modules
        run: |
          python3 Tools/Release/package.py module linux-extra --host any --out dist --add raw-linux-extra/player=player
          python3 Tools/Release/package.py module bsd --host any --out dist --add raw-bsd/player=player
      - name: Manifest
        run: python3 Tools/Release/make_manifest.py --dist dist --channel $CHANNEL --commit $GITHUB_SHA
      - name: Keep the files (dry run)
        if: ${{ startsWith(github.ref, 'refs/heads/ci/') || (github.event_name == 'workflow_dispatch' && !inputs.publish) }}
        uses: actions/upload-artifact@v4
        with: { name: release-dry-run, path: dist, retention-days: 3 }
      - name: Publish
        if: ${{ !startsWith(github.ref, 'refs/heads/ci/') && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="dist/*.tar.gz dist/conqueror-release.json"
          if [ "$CHANNEL" = "conquerorx" ]; then
            # Tek kayan ön sürüm: eskisi (etiketiyle) silinir, bu commit'le yeniden yayımlanır
            gh release delete conquerorx --yes --cleanup-tag || true
            gh release create conquerorx $FILES --prerelease --target $GITHUB_SHA --title "ConquerorX ${GITHUB_SHA::8}" \
              --notes "Built from commit $GITHUB_SHA. Installed from the Hub, ConquerorX updates itself to the newest commit each time the Hub starts."
          else
            PRE=""; [ "$CHANNEL" = "prerelease" ] && PRE="--prerelease"
            gh release create "$GITHUB_REF_NAME" $FILES $PRE --title "Conqueror's Engine ${GITHUB_REF_NAME#v}" --generate-notes
          fi
