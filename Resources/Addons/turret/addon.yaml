Id: conqueror.turret
Name: Turret
Version: 1.0.0
Author: TurcoLabs
Description: >-
  Automatic defense turret: picks the nearest visible target with a tag inside its range,
  turns its head and barrel with limited speed and pitch, leads moving targets, fires
  hitscan bursts or projectiles once the aim is close enough, and idles with a scanning sweep
  when nothing is around.
Category: AI
Icon: crosshairs
