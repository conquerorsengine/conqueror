Id: conqueror.state-machine
Name: Finite State Machine
Version: 1.0.0
Author: TurcoLabs
Description: >-
  A tiny, reusable state machine for any object: write Enter_X / Update_X / Exit_X methods in
  your own script and switch with ChangeState("X"). Tracks the previous state and the time
  spent in the current one, supports timed transitions and logs changes when debugging.
  Includes a traffic light example.
Category: AI
Icon: diagram-project
Tags: [fsm, state-machine, ai, logic, pattern]
Components:
  - Scripts/StateMachine.cqs
  - Scripts/TrafficLight.cqs
Inserts:
  - Name: Traffic Light
    Icon: traffic-light
    Prefab: Prefabs/TrafficLight.cqprefab
    Tooltip: Example state machine cycling green, yellow and red
