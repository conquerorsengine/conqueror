<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #1b1d21; --panel: #24272c; --text: #e8e9eb; --muted: #9aa0a8; --accent: #e0a526; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #cq-container { position: relative; width: min({{WIDTH}}px, 100vw - 32px); aspect-ratio: {{WIDTH}} / {{HEIGHT}};
                  max-height: calc(100vh - 80px); background: #000; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  #canvas { display: block; width: 100%; height: 100%; outline: none; }
  #cq-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #cq-progress { width: 50%; height: 6px; background: #3a3e45; border-radius: 3px; overflow: hidden; }
  #cq-progress-bar { width: 0; height: 100%; background: var(--accent); transition: width .1s; }
  #cq-status { color: var(--muted); }
  #cq-error { display: none; position: absolute; inset: 0; padding: 24px; background: rgba(20,0,0,.9); color: #ffb4a8; white-space: pre-wrap; }
  #cq-footer { width: min({{WIDTH}}px, 100vw - 32px); display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  #cq-title { font-weight: 600; }
  #cq-fullscreen { background: var(--panel); color: var(--text); border: 1px solid #3a3e45; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #cq-fullscreen:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div id="cq-container">
  <canvas id="canvas" tabindex="-1"></canvas>
  <div id="cq-loading"><div id="cq-progress"><div id="cq-progress-bar"></div></div><div id="cq-status">Loading...</div></div>
  <div id="cq-error"></div>
</div>
<div id="cq-footer">
  <span id="cq-title">{{TITLE}}</span>
  <button id="cq-fullscreen" title="Fullscreen">Fullscreen</button>
</div>
<script>
  window.CQ_CONFIG = {{CONFIG}};
  window.CQ_CONFIG.template = "default";
  document.getElementById("cq-fullscreen").onclick = () => document.getElementById("cq-container").requestFullscreen();
</script>
<script>
{{LOADER}}
</script>
</body>
</html>
