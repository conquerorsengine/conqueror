# Conqueror Engine Yocto / Automotive Grade Linux katmanı
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "conqueror"
BBFILE_PATTERN_conqueror = "^${LAYERDIR}/"
BBFILE_PRIORITY_conqueror = "7"

LAYERDEPENDS_conqueror = "core"
# C++23: GCC 13+ (scarthgap ve sonrası). kirkstone tabanlı AGL sürümlerinde meta-clang ile derleyin.
LAYERSERIES_COMPAT_conqueror = "scarthgap styhead walnascar whinlatron"
